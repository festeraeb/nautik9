[package]
name = "nautik9-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NautiK9 integrated mobile and desktop application runtime"

[dependencies]
nautik9-core = { path = "../nautik9-core" }
nautik9-wayfinder = { path = "../nautik9-wayfinder" }
nautik9-lemonade = { path = "../nautik9-lemonade" }
nautik9-fleet = { path = "../nautik9-fleet" }
nautik9-agent = { path = "../nautik9-agent" }
nautik9-bridges = { path = "../nautik9-bridges" }
nautik9-webxdc = { path = "../nautik9-webxdc" }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
axum = "0.8.9"
uuid = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
sha2 = "0.10"
rusqlite = { workspace = true }


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3.10"
http-body-util = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
