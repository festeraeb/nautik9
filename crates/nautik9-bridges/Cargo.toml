[package]
name = "nautik9-bridges"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NautiK9 messenger bridges (Discord, Vector/Nostr): owner versus other callers, inbox, mockable transports"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
nostr = { version = "0.42", default-features = false, features = ["std", "nip44", "nip59"] }

[dev-dependencies]
tempfile = "3.10"
axum = "0.8.9"
